[data]
manifest = "../dataset_manifest.json"
split = "../split_car_only.json"
verify_checksums = true

[model]
name = "global_pointnet"
adapter = "global_points"
point_widths = [64, 128]
head_widths = [64]
input_alignment = "tnet"
alignment_widths = [32, 64]
alignment_regularization = 0.001

[training]
seed = 20260920
device = "auto"
epochs = 30
learning_rate = 0.001
weight_decay = 0.0001
positive_weight = 8.0
patience = 5
max_hours = 4.0
max_optimizer_steps_per_epoch = 1400
yaw_augmentation_deg = 180.0
pitch_augmentation_deg = 0.0
roll_augmentation_deg = 0.0

[output]
root = "../../../../runs"

[augmentation.smoke_relocation]
probability = 0.5
target_min_m = 3.0
target_max_m = 8.0
patch_radius_m = 0.35
clearance_m = 0.25
ray_tolerance_rad = 0.02
minimum_points = 8
attempts = 16
