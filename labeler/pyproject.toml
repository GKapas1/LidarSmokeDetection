[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoke-labeler"
version = "0.4.1"
description = "Frame-preserving raw Livox ROS 2 MCAP smoke pseudo-labeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "mcap>=1.2",
]

[project.scripts]
smoke-label = "smoke_labeler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
