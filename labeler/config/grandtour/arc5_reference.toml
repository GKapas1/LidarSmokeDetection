schema_version = "1.0"
session_id = "2024-11-18-16-59-23"

[sampling]
frame_stride = 2
point_stride = 4
minimum_range_m = 0.1
maximum_range_m = 30.0

[time]
# The robot finishes its walking route at about 300 s. Later stationary scans
# are reserved for clean-reference validation and are not inserted into the map.
reference_start_s = 0.0
reference_end_s = 300.0
validation_start_s = 300.0

[crop]
# Expanded after full-session review to include the dense end-wall surfaces.
min_m = [-3.5, -9.5, -2.0]
max_m = [16.0, 12.5, 3.0]

[voxel]
size_m = 0.05
minimum_distinct_scans = 3
