[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoke-trainer"
version = "0.1.0"
description = "Portable PyTorch training pipeline for LiDAR smoke reliability models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
smoke-train = "smoke_trainer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

