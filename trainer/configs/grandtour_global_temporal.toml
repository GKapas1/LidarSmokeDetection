[data]
manifest = "../../data/training/unified_v1/dataset_manifest.json"
split = "../../experiments/splits/grandtour_temporal_v1.json"
verify_checksums = false
source_domains = ["grandtour_ros1"]
history_length = 5
maximum_time_gap_s = 0.25

[model]
name = "global_temporal_pointnet"
adapter = "global_temporal"
history_length = 5
point_widths = [64, 128]
head_widths = [64]
input_alignment = "tnet"
alignment_widths = [32, 64]
alignment_regularization = 0.001
gru_hidden_width = 32

[training]
seed = 20260920
device = "auto"
epochs = 30
learning_rate = 0.001
weight_decay = 0.0001
positive_weight = 8.0
patience = 5
max_hours = 4.0
yaw_augmentation_deg = 180.0
pitch_augmentation_deg = 0.0
roll_augmentation_deg = 0.0

[output]
root = "../../runs"
