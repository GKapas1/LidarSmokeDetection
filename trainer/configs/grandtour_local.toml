[data]
manifest = "../../data/training/unified_v1/dataset_manifest.json"
split = "../../experiments/splits/grandtour_temporal_v1.json"
voxel_size_m = 0.10
verify_checksums = false
source_domains = ["grandtour_ros1"]

[model]
name = "local_mlp"
hidden_widths = [64, 32]

[training]
seed = 20260920
device = "auto"
epochs = 30
learning_rate = 0.001
weight_decay = 0.0001
positive_weight = 8.0
patience = 5
max_hours = 4.0

[output]
root = "../../runs"
