[data]
manifest = "../../data/training/unified_v1/dataset_manifest.json"
split = "../../experiments/splits/pilot_temporal_v1.json"
verify_checksums = false
# GT consumes only consecutive, same-chunk scans.  At stream startup it uses the
# available shorter history; after this many scans it has a full causal window.
history_length = 5
# Break temporal context across a sensor pause, dropped packet burst, or reset.
# Set this from the expected sensor frame interval before a real training run.
maximum_time_gap_s = 0.25

[model]
name = "global_temporal_pointnet"
adapter = "global_temporal"
history_length = 5
point_widths = [64, 128]
head_widths = [64]
# A compact PointNet-style learned XYZ transform is applied independently to
# each scan. It is identity-initialized and regularized near orthogonal.
input_alignment = "tnet"
alignment_widths = [32, 64]
alignment_regularization = 0.001
# A causal GRU turns the five scan-level PointNet summaries into temporal context.
gru_hidden_width = 32

[training]
seed = 20260920
device = "auto"
epochs = 30
learning_rate = 0.001
weight_decay = 0.0001
positive_weight = 8.0
patience = 5
max_hours = 4.0
# One rigid transform is sampled and applied to every scan in a window, so the
# augmentation teaches pose robustness without inventing impossible motion.
yaw_augmentation_deg = 180.0
pitch_augmentation_deg = 0.0
roll_augmentation_deg = 0.0

[output]
root = "../../runs"
